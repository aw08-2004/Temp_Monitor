{% extends "base.html" %}
{% block title %}{{ t('nav.alerts') }} - FleetHub{% endblock %}
{% block content %}
<h1 class="section-title" style="font-size: var(--text-xl); margin-bottom: var(--space-5);">{{ t('alerts.heading') }}</h1>
<p class="stat-card__meta" style="margin-bottom: var(--space-5);">
    {{ t('alerts.intro') }}
</p>

<div id="alerts-list"></div>
<div class="empty-state" id="alerts-empty" style="display:none;">{{ t('alerts.empty') }}</div>
{% endblock %}
{% block page_scripts %}
<script src="{{ url_for('static', filename='js/alerts.js') }}"></script>
{% endblock %}
