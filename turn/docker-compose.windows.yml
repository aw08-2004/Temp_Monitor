# coturn for a WINDOWS hub host -- LAN AND CREDENTIAL TESTING ONLY (roadmap #2).
#
# NOT used by install.ps1 any more, and NOT a working cross-NAT relay. The installer now
# provisions coturn natively in a dedicated WSL2 distro instead; see turn/README.md.
#
# Why this file can't carry cross-NAT media: Docker Desktop on Windows has no Linux host
# networking, so this variant drops `network_mode: host` and publishes ports instead. That makes
# 3478 reachable and credentials validate -- both peers allocate successfully and the log looks
# healthy -- but the relay sockets still live on the Docker bridge, and relay->peer egress is
# SNAT'd to an arbitrary source port. ICE requires the peer to receive from EXACTLY the
# advertised candidate, so every connectivity check fails ~16s in. See README.md 'Host-OS
# notes', trap 2.
#
# Still genuinely useful for: proving the hub<->coturn credential path, and LAN-only setups.
#   docker compose -f docker-compose.windows.yml up -d
#
# It reads the same two variables from a .env beside it (the installer writes them):
#   REMOTE_TURN_SECRET  -- the SAME value as the hub's .env; coturn validates minted creds against it.
#   TURN_EXTERNAL_IP    -- the PUBLIC IP clients reach this host on (relay candidates advertise it).
#
# Open UDP+TCP 3478 and UDP 49160-49200 to this host, or allocations succeed but media never flows.
# See README.md for the Linux (host-networking) variant, firewall notes, and optional TLS.
services:
  turn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    ports:
      - "${TURN_PORT:-3478}:3478/udp"
      - "${TURN_PORT:-3478}:3478/tcp"
      - "${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49200}:49160-49200/udp"
    command: >
      -n --log-file=stdout --no-cli --no-tls --no-dtls
      --use-auth-secret --static-auth-secret=${REMOTE_TURN_SECRET}
      --realm=${TURN_REALM:-fleethub}
      --listening-port=3478
      --min-port=${TURN_MIN_PORT:-49160} --max-port=${TURN_MAX_PORT:-49200}
      --external-ip=${TURN_EXTERNAL_IP}
      --fingerprint
