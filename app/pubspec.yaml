name: fleethub_client
description: The native FleetHub client -- fleet, alerts, Wake-on-LAN and quick commands.
publish_to: none

# Two versions, and they are not the same thing:
#  * `version` below is what pubspec/Flutter build tooling uses.
#  * The version an operator sees, and the one the Download Client page compares against,
#    comes from the SIGNED client manifest (hub/client.manifest.json). Keep them in step
#    when releasing -- sign_release.py --sign-client takes it as an argument rather than
#    reading this file, deliberately, so a release is never accidentally cut from an
#    uncommitted edit here.
version: 1.1.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State. Polling, auth state and error state spread across every screen is exactly what
  # this handles; a hand-rolled InheritedWidget would be the same thing, written here.
  flutter_riverpod: ^2.5.1

  # The token must never sit in a plain file. On Windows this is DPAPI-backed, so the
  # stored blob is bound to the Windows user account -- copying it to another machine
  # yields nothing.
  flutter_secure_storage: ^9.2.2

  # Pairing opens the SYSTEM browser, not an embedded webview. That is the whole point of
  # RFC 8252: the sign-in happens somewhere the user can see the address bar and the
  # identity provider's own session lives, and the app never sees the credentials.
  url_launcher: ^6.3.0

  http: ^1.2.0

  # Desktop shell: tray icon, minimise-to-tray, native toasts.
  window_manager: ^0.4.2
  tray_manager: ^0.2.3
  # Registers a Start Menu shortcut with an AppUserModelID, which is what Windows requires
  # before it will show a toast at all. That is why this rather than a bare Win32 call:
  # an unsigned, non-MSIX build has no application identity of its own.
  local_notifier: ^0.1.6

  intl: ^0.19.0

  # Ed25519, in pure Dart. The client verifies the SAME signed manifest the console's
  # Download page renders and the agent's updater pattern uses -- an update prompt that
  # trusted an unverified document would be a prompt anyone who could answer for the hub's
  # hostname could use to hand the helpdesk a binary.
  cryptography: ^2.7.0

  # Remembers which version was skipped. Deliberately NOT flutter_secure_storage: this is a
  # preference, not a credential, and the two should not share a store.
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
